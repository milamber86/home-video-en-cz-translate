---
# Ansible modules must run as arm64 even if the controller venv is Rosetta.
ansible_python_interpreter: "{{ playbook_dir }}/scripts/ansible_python"

# Shared paths
work_root: "{{ playbook_dir }}/work"
venv_path: "{{ playbook_dir }}/.venv"
venv_python: "{{ venv_path }}/bin/python"
venv_uv: "{{ venv_path }}/bin/uv"
python_brew_pkg: python@3.11
scripts_dir: "{{ playbook_dir }}/scripts"
vendor_dir: "{{ playbook_dir }}/vendor"
f5_repo_dir: "{{ vendor_dir }}/F5-TTS"

# Native Apple Silicon Homebrew only. Never search /usr/local (Rosetta brew).
homebrew_prefix: /opt/homebrew
brew_bin: "{{ homebrew_prefix }}/bin"
brew_env:
  PATH: "{{ brew_bin }}:/usr/bin:/bin:/usr/sbin:/sbin"
  HOMEBREW_PREFIX: "{{ homebrew_prefix }}"
  HOMEBREW_REPOSITORY: "{{ homebrew_prefix }}"
  HOMEBREW_CELLAR: "{{ homebrew_prefix }}/Cellar"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_COLOR: "1"


# ASR
whisper_backend: mlx
whisper_model: mlx-community/whisper-large-v3-mlx

# Translation (Ollama first, Marian fallback)
translation_backend: ollama_first
ollama_url: http://127.0.0.1:11434
ollama_model: qwen2.5:14b
ollama_bind: 127.0.0.1:11434
marian_model: Helsinki-NLP/opus-mt-tc-big-en-ces_slk

force_translate: false
force_tts: false
# Wipe per-cue WAVs even when czech_vocals.wav is already gone.
# force_tts also deletes tts/segments so cues regenerate instead of resuming.
tts_fresh: false

# Piper (stock male Czech voice)
piper_voice_dir: "{{ playbook_dir }}/models/piper"
piper_voice: cs_CZ-jirka-medium
piper_voice_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/cs/cs_CZ/jirka/medium

# Coqui lives in an isolated venv (old transformers). XTTS-v2 is the default cloner.
xtts_venv: "{{ playbook_dir }}/.venv-xtts"
xtts_python: "{{ xtts_venv }}/bin/python"
xtts_model: tts_models/multilingual/multi-dataset/xtts_v2
tts_vits_model: tts_models/cs/cv/vits

# Voice / TTS. auto uses pretrained XTTS-v2 (Czech included) when model.pth is cached.
# Czech F5 is opt-in: tts_engine=f5.
voice_mode: clone
tts_voice_gender: male
voice_ref_wav: "{{ playbook_dir }}/files/voices/czech_default_ref.wav"
voice_ref_text: "{{ playbook_dir }}/files/voices/czech_default_ref.txt"
f5_model: F5TTS_v1_Base
f5_nfe_step: 32
tts_max_speed: 1.35
f5_ckpt_dir: "{{ playbook_dir }}/models/f5_czech"
tts_engine: auto

# Czech F5 fine-tune (VoxPopuli Czech; Common Voice is no longer on Hugging Face)
f5_train_dataset: facebook/voxpopuli
f5_train_dataset_config: cs
f5_train_dataset_split: train
f5_train_local_dir: ""
f5_train_max_hours: 20
f5_train_device: cpu
f5_train_epochs: 10
f5_train_batch_frames: 1600
f5_train_grad_accum: 4
f5_train_lr: 1.0e-5
f5_train_force: false
f5_data_dir: "{{ playbook_dir }}/data/f5_czech"
f5_train_min_seconds: 1.0
f5_train_max_seconds: 12.0
f5_train_dataset_name: czech
f5_train_text_column: raw_text
f5_train_audio_column: audio
f5_train_prep_workers: 8
# In-process loading. F5's default 16 persistent workers hit EMFILE on epoch 2.
f5_train_num_workers: 0
f5_train_last_per_updates: 100
# 10 CPU epochs is ~40h at ~9s/update; Ansible kills the job when this elapses.
f5_train_async_seconds: 259200
f5_train_smoke_text: "Za svítání šel dům přes louku."

pytorch_env:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"
  PYTHONUNBUFFERED: "1"

# Remux
output_container: mkv
vocals_gain: 1.0
bed_gain: 0.85

# yt-dlp
ytdlp_cookies_from_browser: ""

# Demucs CLI --segment is an int; htdemucs transformer max is 7.8s
demucs_model: htdemucs
demucs_segment: 7
demucs_overlap: 0.25
