---
- name: Install Ollama via Homebrew
  community.general.homebrew:
    name: ollama
    state: present

- name: Start Ollama Homebrew service (localhost LaunchAgent)
  community.general.homebrew_services:
    name: ollama
    state: started
  register: ollama_service
  ignore_errors: true

- name: Start Ollama via brew services fallback
  ansible.builtin.command:
    argv: [brew, services, start, ollama]
  when: ollama_service is failed
  register: ollama_service_fallback
  changed_when: ollama_service_fallback.rc == 0

- name: Wait for Ollama API on localhost
  ansible.builtin.uri:
    url: "{{ ollama_url }}/api/tags"
    method: GET
    status_code: 200
  register: ollama_ready
  until: ollama_ready.status | default(0) == 200
  retries: 24
  delay: 5

- name: Fail if Ollama API never became ready
  ansible.builtin.fail:
    msg: >-
      Ollama did not respond at {{ ollama_url }}/api/tags.
      Check `brew services list` and `brew services restart ollama`.
      The service is bound to localhost only ({{ ollama_bind }}).
  when: ollama_ready.status | default(0) != 200

- name: List installed Ollama models
  ansible.builtin.command:
    argv: [ollama, list]
  register: ollama_list
  changed_when: false
  environment:
    OLLAMA_HOST: "{{ ollama_bind }}"

- name: Pull Ollama translation model
  ansible.builtin.command:
    argv: [ollama, pull, "{{ ollama_model }}"]
  environment:
    OLLAMA_HOST: "{{ ollama_bind }}"
  async: 3600
  poll: 15
  register: ollama_pull
  when: ollama_model not in ollama_list.stdout
  failed_when: ollama_pull.rc | default(0) != 0
