---
- name: Warn if this host is not Apple Silicon arm64
  ansible.builtin.debug:
    msg: >-
      Expected Apple Silicon arm64; ansible_machine={{ ansible_architecture | default(ansible_machine) }}.
      PyTorch MPS will likely be unavailable under Rosetta or on Intel.
  when: ansible_architecture | default(ansible_machine) != "arm64"

- name: Record module interpreter architecture
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - -c
      - |
        import json, platform, sys, time
        from pathlib import Path
        p = Path("/Users/otto/Cursor_Repos/home-video-en-cz-translate/.cursor/debug-e0bbd4.log")
        payload = {
            "sessionId": "e0bbd4",
            "runId": "post-fix",
            "hypothesisId": "D",
            "location": "roles/setup/tasks/main.yml:module_arch",
            "message": "Ansible module python after wrapper",
            "data": {
                "executable": sys.executable,
                "platform_machine": platform.machine(),
                "ansible_architecture": "{{ ansible_architecture | default('') }}",
            },
            "timestamp": int(time.time() * 1000),
        }
        p.parent.mkdir(parents=True, exist_ok=True)
        p.open("a", encoding="utf-8").write(json.dumps(payload) + "\n")
        print(platform.machine())
  register: module_arch
  changed_when: false

- name: Stat Apple Silicon Homebrew
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: as_homebrew

- name: Install Apple Silicon Homebrew into /opt/homebrew
  when:
    - ansible_architecture | default(ansible_machine) == "arm64"
    - not as_homebrew.stat.exists
  block:
    - name: Create Homebrew prefix owned by the invoking user
      become: true
      ansible.builtin.file:
        path: /opt/homebrew
        state: directory
        owner: "{{ ansible_user_id }}"
        group: admin
        mode: "0755"

    - name: Clone Homebrew/brew into /opt/homebrew
      ansible.builtin.git:
        repo: https://github.com/Homebrew/brew
        dest: /opt/homebrew
        version: main
        depth: 1
        update: false
  rescue:
    - name: Explain sudo is required to create /opt/homebrew
      ansible.builtin.fail:
        msg: >-
          Could not install Apple Silicon Homebrew at /opt/homebrew.
          Creating that prefix needs sudo. Re-run with -K (ask for privilege password):

            ansible-playbook site.yml -K -e youtube_url='...'

          Original error: {{ ansible_failed_result.msg | default(ansible_failed_result) }}

- name: Re-stat Apple Silicon Homebrew after install
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: as_homebrew

- name: Fail if Apple Silicon Homebrew is still missing
  ansible.builtin.fail:
    msg: "Homebrew was not found at /opt/homebrew/bin/brew after the install attempt."
  when:
    - ansible_architecture | default(ansible_machine) == "arm64"
    - not as_homebrew.stat.exists

- name: Read Homebrew git branch
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/homebrew
      - rev-parse
      - --abbrev-ref
      - HEAD
  register: brew_head
  changed_when: false
  when:
    - ansible_architecture | default(ansible_machine) == "arm64"
    - as_homebrew.stat.exists

- name: Fetch Homebrew main
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/homebrew
      - fetch
      - --depth
      - "1"
      - origin
      - main
  when:
    - ansible_architecture | default(ansible_machine) == "arm64"
    - as_homebrew.stat.exists
    - (brew_head.stdout | default('') | trim) != "main"

- name: Check out Homebrew main
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /opt/homebrew
      - checkout
      - -B
      - main
      - FETCH_HEAD
  when:
    - ansible_architecture | default(ansible_machine) == "arm64"
    - as_homebrew.stat.exists
    - (brew_head.stdout | default('') | trim) != "main"

- name: Verify native brew prefix is /opt/homebrew
  ansible.builtin.command:
    argv:
      - arch
      - -arm64
      - /opt/homebrew/bin/brew
      - --prefix
  register: brew_prefix_check
  changed_when: false
  failed_when: >-
    brew_prefix_check.rc != 0
    or (brew_prefix_check.stdout | trim) != '/opt/homebrew'
  when: ansible_architecture | default(ansible_machine) == "arm64"

- name: Prefer native Homebrew on PATH
  ansible.builtin.set_fact:
    brew_bin: "{{ homebrew_prefix }}/bin"
  when: ansible_architecture | default(ansible_machine) == "arm64"

- name: Require Homebrew
  ansible.builtin.command:
    argv:
      - arch
      - -arm64
      - "{{ brew_bin }}/brew"
      - --version
  register: brew_version
  changed_when: false
  failed_when: brew_version.rc != 0
  environment: "{{ brew_env }}"

- name: Fail if brew is running as Intel/Rosetta
  ansible.builtin.fail:
    msg: >-
      Native brew at {{ brew_bin }}/brew reported an Intel/Rosetta environment.
      Package installs must use arch -arm64. Output: {{ brew_version.stdout }} {{ brew_version.stderr }}
  when: "'Intel x86_64' in (brew_version.stderr | default('')) or 'Intel x86_64' in (brew_version.stdout | default(''))"

- name: Install Homebrew packages
  ansible.builtin.command:
    argv:
      - arch
      - -arm64
      - "{{ brew_bin }}/brew"
      - install
      - git
      - ffmpeg
      - uv
      - "{{ python_brew_pkg }}"
  register: brew_install
  environment: "{{ brew_env }}"
  changed_when: >-
    'Pouring' in (brew_install.stdout | default(''))
    or 'Fetching downloads' in (brew_install.stdout | default(''))
    or '==> Installing' in (brew_install.stdout | default(''))
  failed_when: brew_install.rc != 0

- name: Resolve Homebrew Python prefix
  ansible.builtin.command:
    argv:
      - arch
      - -arm64
      - "{{ brew_bin }}/brew"
      - --prefix
      - "{{ python_brew_pkg }}"
  register: python_prefix
  changed_when: false
  environment: "{{ brew_env }}"

- name: Prefer python3.11 binary
  ansible.builtin.stat:
    path: "{{ python_prefix.stdout | trim }}/bin/python3.11"
  register: python311_bin

- name: Fall back to python3 binary
  ansible.builtin.stat:
    path: "{{ python_prefix.stdout | trim }}/bin/python3"
  register: python3_bin

- name: Fail if Homebrew Python is missing
  ansible.builtin.fail:
    msg: "Python not found under {{ python_prefix.stdout | trim }}/bin. Check {{ python_brew_pkg }} is installed."
  when: not python311_bin.stat.exists and not python3_bin.stat.exists

- name: Set Python interpreter fact
  ansible.builtin.set_fact:
    brew_python: "{{ python311_bin.stat.path if python311_bin.stat.exists else python3_bin.stat.path }}"

- name: Create project virtualenv
  ansible.builtin.command:
    argv:
      - "{{ brew_bin }}/uv"
      - venv
      - "{{ venv_path }}"
      - --python
      - "{{ brew_python }}"
    creates: "{{ venv_python }}"
  environment: "{{ brew_env }}"

- name: Install Python dependencies into venv
  ansible.builtin.command:
    argv:
      - "{{ brew_bin }}/uv"
      - pip
      - install
      - --python
      - "{{ venv_python }}"
      - -r
      - "{{ playbook_dir }}/requirements.txt"
  register: uv_pip
  changed_when: "'Installed' in (uv_pip.stdout | default('')) or 'Uninstalled' in (uv_pip.stdout | default(''))"
  environment: "{{ brew_env }}"

- name: Verify ffmpeg
  ansible.builtin.command:
    argv:
      - "{{ brew_bin }}/ffmpeg"
      - -version
  register: ffmpeg_version
  changed_when: false
  failed_when: ffmpeg_version.rc != 0
  environment: "{{ brew_env }}"

- name: Verify PyTorch MPS on Apple Silicon
  ansible.builtin.command:
    argv:
      - "{{ venv_python }}"
      - -c
      - |
        import os
        os.environ.setdefault("PYTORCH_ENABLE_MPS_FALLBACK", "1")
        import torch
        ok = torch.backends.mps.is_available() and torch.backends.mps.is_built()
        print("mps_available=" + str(ok))
        raise SystemExit(0 if ok else 1)
  environment: "{{ pytorch_env }}"
  register: mps_check
  changed_when: false
  failed_when: mps_check.rc != 0
  when: ansible_architecture | default(ansible_machine) == "arm64"
