---
- name: Require youtube_url
  ansible.builtin.assert:
    that:
      - youtube_url is defined
      - youtube_url | length > 0
    fail_msg: "Pass -e youtube_url='https://www.youtube.com/watch?v=...'"

- name: Require Deno for YouTube JS challenges
  ansible.builtin.stat:
    path: "{{ brew_bin }}/deno"
  register: deno_bin

- name: Fail if Deno is missing
  ansible.builtin.fail:
    msg: >-
      Deno is required for yt-dlp YouTube downloads (HTTP 403 without a JS runtime).
      Re-run with --tags setup so Homebrew can install deno.
  when: not deno_bin.stat.exists

- name: Resolve YouTube video ID
  ansible.builtin.command:
    argv:
      - "{{ venv_python }}"
      - -m
      - yt_dlp
      - --js-runtimes
      - "deno:{{ brew_bin }}/deno"
      - --remote-components
      - ejs:github
      - --print
      - id
      - --skip-download
      - --no-warnings
      - "{{ youtube_url }}"
  register: ytdlp_id
  changed_when: false
  environment: "{{ brew_env }}"

- name: Set job facts
  ansible.builtin.set_fact:
    video_id: "{{ ytdlp_id.stdout | trim }}"
    job_dir: "{{ work_root }}/{{ ytdlp_id.stdout | trim }}"

- name: Create job directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ work_root }}"
    - "{{ job_dir }}"
    - "{{ job_dir }}/raw"
    - "{{ job_dir }}/audio"
    - "{{ job_dir }}/subs"
    - "{{ job_dir }}/tts"
    - "{{ job_dir }}/tts/segments"
    - "{{ job_dir }}/output"

- name: Check for existing video
  ansible.builtin.stat:
    path: "{{ job_dir }}/raw/{{ video_id }}.mp4"
  register: video_stat

- name: Find leftover yt-dlp part files
  ansible.builtin.find:
    paths: "{{ job_dir }}/raw"
    patterns:
      - "*.part"
      - "*.ytdl"
  register: ytdlp_parts
  when: not video_stat.stat.exists

- name: Remove leftover yt-dlp part files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ytdlp_parts.files | default([]) }}"
  when: not video_stat.stat.exists

- name: Download video and English subtitles
  ansible.builtin.command:
    argv: "{{ ytdlp_args + ytdlp_cookie_args + [youtube_url] }}"
  vars:
    ytdlp_args:
      - "{{ venv_python }}"
      - -m
      - yt_dlp
      - --js-runtimes
      - "deno:{{ brew_bin }}/deno"
      - --remote-components
      - ejs:github
      - --format
      - "{{ ytdlp_format }}"
      - --merge-output-format
      - mp4
      - --write-subs
      - --write-auto-subs
      - --sub-langs
      - en.*
      - --convert-subs
      - srt
      - --restrict-filenames
      - --continue
      - --retries
      - "10"
      - --fragment-retries
      - "10"
      - --output
      - "{{ job_dir }}/raw/%(id)s.%(ext)s"
    ytdlp_cookie_args: "{{ ['--cookies-from-browser', ytdlp_cookies_from_browser] if ytdlp_cookies_from_browser | length > 0 else [] }}"
  register: ytdlp_download
  failed_when: ytdlp_download.rc != 0
  environment: "{{ brew_env }}"
  when: not video_stat.stat.exists

- name: Recheck downloaded video
  ansible.builtin.stat:
    path: "{{ job_dir }}/raw/{{ video_id }}.mp4"
  register: video_stat_after

- name: Fail if video file is missing
  ansible.builtin.fail:
    msg: "yt-dlp did not produce {{ job_dir }}/raw/{{ video_id }}.mp4"
  when: not video_stat_after.stat.exists

- name: Check for extracted source WAV
  ansible.builtin.stat:
    path: "{{ job_dir }}/audio/source.wav"
  register: source_wav_stat

- name: Extract stereo PCM audio
  ansible.builtin.command:
    argv:
      - ffmpeg
      - -y
      - -i
      - "{{ job_dir }}/raw/{{ video_id }}.mp4"
      - -vn
      - -acodec
      - pcm_s16le
      - -ar
      - "44100"
      - -ac
      - "2"
      - "{{ job_dir }}/audio/source.wav"
  register: extract_audio
  failed_when: extract_audio.rc != 0
  when: not source_wav_stat.stat.exists

- name: Persist job facts for later tags
  ansible.builtin.copy:
    dest: "{{ work_root }}/current_job.yml"
    mode: "0644"
    content: |
      video_id: "{{ video_id }}"
      job_dir: "{{ job_dir }}"
      video_path: "{{ job_dir }}/raw/{{ video_id }}.mp4"
      source_wav: "{{ job_dir }}/audio/source.wav"
