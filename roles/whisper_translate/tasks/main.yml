---
- name: Load last job facts
  ansible.builtin.include_vars: "{{ work_root }}/current_job.yml"
  when: video_id is not defined

- name: Check existing Czech subtitles
  ansible.builtin.stat:
    path: "{{ job_dir }}/subs/cs.srt"
  register: cs_srt

- name: Check Whisper English transcript
  ansible.builtin.stat:
    path: "{{ job_dir }}/subs/whisper.en.srt"
  register: whisper_en_srt

- name: Skip translation unless missing, forced, or English source is newer
  ansible.builtin.set_fact:
    skip_translate: >-
      {{
        cs_srt.stat.exists
        and not (force_translate | default(false) | bool)
        and (
          not whisper_en_srt.stat.exists
          or cs_srt.stat.mtime >= whisper_en_srt.stat.mtime
        )
      }}

- name: Transcribe vocals with Whisper and translate
  ansible.builtin.command:
    argv:
      - "{{ venv_python }}"
      - "{{ scripts_dir }}/whisper_translate.py"
      - --audio
      - "{{ job_dir }}/audio/vocals.wav"
      - --out-en
      - "{{ job_dir }}/subs/en.srt"
      - --out-cs
      - "{{ job_dir }}/subs/cs.srt"
      - --whisper-model
      - "{{ whisper_model }}"
      - --device
      - mps
      - --translation-backend
      - "{{ translation_backend }}"
      - --ollama-url
      - "{{ ollama_url }}"
      - --ollama-model
      - "{{ ollama_model }}"
      - --marian-model
      - "{{ marian_model }}"
      - --speaker-gender
      - "{{ speaker_gender }}"
  environment: "{{ pytorch_env }}"
  register: whisper_translate
  failed_when: whisper_translate.rc != 0
  when: not skip_translate

- name: Verify Czech SRT
  ansible.builtin.stat:
    path: "{{ job_dir }}/subs/cs.srt"
  register: cs_srt_after

- name: Fail if Czech SRT is missing
  ansible.builtin.fail:
    msg: "whisper_translate.py did not write {{ job_dir }}/subs/cs.srt"
  when: not cs_srt_after.stat.exists
