[project]
name = "home-video-en-cz-translate"
version = "1.0.0"
description = "Local EN to CS video translation pipeline for Apple Silicon"
requires-python = "==3.11.*"
dependencies = [
    "accelerate>=0.34.0",
    "datasets>=3.0.0",
    "demucs>=4.0.0",
    "f5-tts>=1.0.0",
    "huggingface-hub>=0.25.0",
    "httpx>=0.27.0",
    "librosa>=0.10.0",
    "mlx-whisper>=0.4.0",
    "num2words>=0.5.13",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "piper-tts>=1.3.0",
    "pydub>=0.25.1",
    "sacremoses>=0.1.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.1",
    "srt>=3.5.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.44.0",
    "yt-dlp[default,curl-cffi]>=2025.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
default-groups = []

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B905",
    "RUF001",
    "RUF007",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
